# The suites at depth, too slow for every pull request: `ci.yml` runs them at
# their small defaults. Nightly on main, or by hand from the Actions tab.
name: deep

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      # rust-cache keeps libduckdb-sys's build but not the DuckDB library its
      # build script downloaded. Run the script again, or linking fails.
      - run: cargo clean -p libduckdb-sys
      - run: just oracle 1000

  crash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      - run: just crash
