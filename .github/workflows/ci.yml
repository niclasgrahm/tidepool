name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces its run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What `just ci` runs locally: formatting, clippy, the tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      # rust-cache keeps libduckdb-sys's build but not the DuckDB library its
      # build script downloaded. Run the script again, or linking fails.
      - run: cargo clean -p libduckdb-sys
      - run: just ci

  # The release build: frontend built and embedded, one binary. Proves that the
  # `embed-assets` path, which `just ci` deliberately skips, still compiles and
  # serves the app.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: just build
      - run: just test-embed

  # The browser end to end: headless Chrome against the built UI. Chrome is on
  # the runner; its sandbox needs the user namespaces Ubuntu restricts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: just e2e

  # Dependency policy: licences, RUSTSEC advisories, bans, sources.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Secret scan of the commits in each push and pull request. `just scan-secrets`
  # is the same scan over the whole history.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The doc site. Its reference is committed, and `tidepool-docsgen`'s tests
  # (in `test` above) are what say it still matches the source. This job
  # checks that the site itself builds: a doc comment can be valid Rust and
  # still break the page it lands on (Vue compiles these files), and a dead
  # link fails the build.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
