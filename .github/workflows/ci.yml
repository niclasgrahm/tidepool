name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What `just ci` runs locally: formatting, clippy, the tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just ci

  # The store's unsafe code (the tail segment, from M2) under Miri. Nightly-only,
  # so its own job; locally it is `just miri`, which needs `rustup toolchain
  # install nightly --component miri`.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: extractions/setup-just@v2
      - run: just miri

  # The release build: frontend built and embedded, one binary. Proves that the
  # `embed-assets` path, which `just ci` deliberately skips, still compiles and
  # serves the app.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: just build
      - run: just test-embed

  # Dependency policy: licences, RUSTSEC advisories, bans, sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The doc site. Its reference is committed, and `tidepool-docsgen`'s tests
  # (in `test` above) are what say it still matches the source. This job
  # checks that the site itself builds: a doc comment can be valid Rust and
  # still break the page it lands on (Vue compiles these files), and a dead
  # link fails the build.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
