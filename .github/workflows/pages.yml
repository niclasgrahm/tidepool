# Publishes the doc site to GitHub Pages: https://propell.dev/tidepool/
#
# propell.dev is the custom domain on the account's user site, so every
# project page hangs off it; the site's `base` is `/tidepool/` to match.
#
# The reference is generated by `tidepool-docsgen` and committed, which is
# what lets this job be `npm ci && npm run build` with no Rust toolchain.
# `ci` has already checked, on the way to main, that the committed reference
# matches the source, so nothing is regenerated here.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates with a short-lived OIDC token, not a secret
  id-token: write

# A queued deploy is superseded by a newer one. A deploy in progress
# finishes: cancelled midway, the site can be left half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `lastUpdated` reads each page's git history, which a shallow
          # clone doesn't have
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
