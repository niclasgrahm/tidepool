# Spike for decision D10 (docs/plan.md): can a Leptos client drive ECharts and a
# large virtualised list through thin JS interop? Not part of the workspace and
# not shipped; kept for reference once the decision is recorded.
[package]
name = "leptos-charts-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement", "Window", "Element", "ResizeObserver"] }
serde_json = "1"
console_error_panic_hook = "0.1"
