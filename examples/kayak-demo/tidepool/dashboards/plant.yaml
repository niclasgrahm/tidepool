name: Plant floor
layout: { columns: 12, row_height: 80 }
filters:
  - field: machines.line
  - field: machines.name
  - field: stoppages.reason
visuals:
  - id: kpi_produced
    type: kpi
    metrics: [produced]
    at: { x: 0, y: 0, w: 3, h: 2 }
  - id: kpi_scrap
    type: kpi
    metrics: [scrap_rate]
    at: { x: 3, y: 0, w: 3, h: 2 }
  - id: kpi_downtime
    type: kpi
    metrics: [downtime_minutes]
    at: { x: 6, y: 0, w: 3, h: 2 }
  - id: kpi_stoppages
    type: kpi
    metrics: [stoppage_count]
    at: { x: 9, y: 0, w: 3, h: 2 }
  - id: by_machine
    type: bar
    dimensions: [machines.name]
    metrics: [produced]
    on_click: select
    at: { x: 0, y: 2, w: 6, h: 4 }
  - id: downtime_by_reason
    type: bar
    dimensions: [stoppages.reason]
    metrics: [downtime_minutes]
    on_click: select
    at: { x: 6, y: 2, w: 6, h: 4 }
  - id: temperature
    type: line
    dimensions: [readings.minute]
    metrics: [avg_temperature, produced]
    at: { x: 0, y: 6, w: 12, h: 4 }
  - id: machines
    type: table
    dimensions: [machines.name, machines.line]
    metrics: [produced, rejected, avg_temperature, peak_vibration, downtime_minutes]
    at: { x: 0, y: 10, w: 12, h: 4 }
