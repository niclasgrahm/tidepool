# Plant topics → Tidepool tables, through Kayak's `tidepool` output: the
# table is read when a pipeline starts and the mapping checked against it,
# each batch is one request with an idempotency key, and a busy or
# unreachable Tidepool is retried without writing anything twice.
pipelines:
- id: machines
  inputs:
  - type: mqtt
    connection: plant
    topic: plant/machines/#
    qos: at_least_once
  transforms: []
  outputs:
  # the publisher sends rows shaped as the table is: sent as they are
  - type: tidepool
    connection: tidepool
    table: machines
- id: readings
  inputs:
  - type: mqtt
    connection: plant
    topic: plant/readings
    qos: at_least_once
    max_batch: 500
  transforms:
  - type: buffer
    seconds: 1
    max_messages: 5000
  outputs:
  # mapped column by column: a type Tidepool can't take, or a column it
  # needs that nothing writes, stops the pipeline at startup and says so
  - type: tidepool
    connection: tidepool
    table: readings
    columns:
    - { name: machine_id, type: text, nullable: false }
    - { name: at, type: timestamp, nullable: false }
    - { name: temperature, type: float, nullable: false }
    - { name: vibration, type: float, nullable: false }
    - { name: speed, type: integer, nullable: false }
    - { name: produced, type: integer, nullable: false }
    - { name: rejected, type: integer, nullable: false }
- id: stoppages
  inputs:
  - type: mqtt
    connection: plant
    topic: plant/stoppages
    qos: at_least_once
  transforms: []
  outputs:
  - type: tidepool
    connection: tidepool
    table: stoppages
