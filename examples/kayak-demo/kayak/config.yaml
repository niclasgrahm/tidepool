# Plant topics → Tidepool tables. The publisher sends rows shaped as the
# tables are, so each pipeline only batches (Tidepool takes a JSON array
# of rows per request) and posts.
pipelines:
- id: machines
  inputs:
  - type: mqtt
    connection: plant
    topic: plant/machines/#
    qos: at_least_once
  transforms: []
  outputs:
  - type: http
    url: http://tidepool:7070/v1/tables/machines/rows
    body: batch
- id: readings
  inputs:
  - type: mqtt
    connection: plant
    topic: plant/readings
    qos: at_least_once
    max_batch: 500
  transforms:
  - type: buffer
    seconds: 1
    max_messages: 5000
  outputs:
  - type: http
    url: http://tidepool:7070/v1/tables/readings/rows
    body: batch
- id: stoppages
  inputs:
  - type: mqtt
    connection: plant
    topic: plant/stoppages
    qos: at_least_once
  transforms: []
  outputs:
  - type: http
    url: http://tidepool:7070/v1/tables/stoppages/rows
    body: batch
