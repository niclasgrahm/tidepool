name: Fulfilment
layout: { columns: 12, row_height: 80 }
filters:
  - field: orders.ordered_at
    widget: date_range
    default: { last: 30, unit: minute }
  - field: orders.status
  - field: shippers.shipper
    measure: order_count
  - field: employees.org
    measure: order_count
  - field: orders.ship_country
    measure: order_count
visuals:
  - id: kpi_open
    type: kpi
    metrics: [open_orders]
    at: { x: 0, y: 0, w: 3, h: 2 }
  - id: kpi_shipped
    type: kpi
    metrics: [shipped_orders]
    at: { x: 3, y: 0, w: 3, h: 2 }
  - id: kpi_late
    type: kpi
    metrics: [late_rate]
    at: { x: 6, y: 0, w: 3, h: 2 }
  - id: kpi_days
    type: kpi
    metrics: [avg_days_to_ship]
    at: { x: 9, y: 0, w: 3, h: 2 }
  - id: backlog
    type: line
    dimensions: [orders.minute]
    metrics: [open_orders, shipped_orders, late_orders]
    at: { x: 0, y: 2, w: 12, h: 4 }
  - id: by_shipper
    type: bar
    dimensions: [shippers.shipper]
    metrics: [open_orders, late_orders]
    on_click: select
    at: { x: 0, y: 6, w: 6, h: 4 }
  - id: by_status
    type: bar
    dimensions: [orders.status]
    metrics: [order_count]
    on_click: select
    at: { x: 6, y: 6, w: 6, h: 4 }
  - id: employees
    type: table
    dimensions: [employees.employee, employees.title]
    metrics: [order_count, revenue, open_orders, late_orders, late_rate, freight]
    sort: { by: revenue, desc: true }
    on_click: select
    at: { x: 0, y: 10, w: 12, h: 5 }
