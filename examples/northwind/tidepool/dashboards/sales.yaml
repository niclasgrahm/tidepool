name: Live sales
layout: { columns: 12, row_height: 80 }
filters:
  # opens on the last 30 minutes, moving as time passes
  - field: orders.ordered_at
    widget: date_range
    default: { last: 30, unit: minute }
  - field: categories.category
    measure: revenue
  - field: customers.country
    measure: revenue
  - field: employees.org
    measure: revenue
  - field: shippers.shipper
    measure: revenue
visuals:
  - id: kpi_revenue
    type: kpi
    metrics: [revenue]
    at: { x: 0, y: 0, w: 3, h: 2 }
  - id: kpi_orders
    type: kpi
    metrics: [order_count]
    at: { x: 3, y: 0, w: 3, h: 2 }
  - id: kpi_aov
    type: kpi
    metrics: [avg_order_value]
    at: { x: 6, y: 0, w: 3, h: 2 }
  - id: kpi_customers
    type: kpi
    metrics: [customer_count]
    at: { x: 9, y: 0, w: 3, h: 2 }
  - id: per_minute
    type: line
    dimensions: [orders.minute]
    metrics: [revenue, order_count]
    at: { x: 0, y: 2, w: 12, h: 4 }
  - id: by_category
    type: bar
    dimensions: [categories.category]
    metrics: [revenue]
    sort: { by: revenue, desc: true }
    on_click: select
    at: { x: 0, y: 6, w: 6, h: 4 }
  - id: by_country
    type: bar
    dimensions: [customers.country]
    metrics: [revenue]
    sort: { by: revenue, desc: true }
    limit: 12
    on_click: select
    at: { x: 6, y: 6, w: 6, h: 4 }
  - id: top_products
    type: table
    dimensions: [products.product, categories.category, suppliers.country]
    metrics: [revenue, units, avg_discount, orders_with]
    sort: { by: revenue, desc: true }
    limit: 25
    on_click: select
    at: { x: 0, y: 10, w: 12, h: 5 }
