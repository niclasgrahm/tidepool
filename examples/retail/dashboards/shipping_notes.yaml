name: Shipping notes
layout: { columns: 12, row_height: 80 }
filters:
  # a text box: the orders whose note contains what's typed, ignoring the
  # case of letters; every visual answers for those orders
  - field: orders.note
    widget: search
  - field: orders.status
visuals:
  - id: kpi_orders
    type: kpi
    metrics: [order_count]
    at: { x: 0, y: 0, w: 3, h: 2 }
  - id: by_region
    type: bar
    dimensions: [customers.region]
    metrics: [order_count]
    on_click: select
    at: { x: 0, y: 2, w: 3, h: 5 }
  # the newest orders that pass the selection, newest first; the columns
  # can come from tables the orders reach
  - id: latest
    type: rows
    dimensions: [orders.ordered_at, customers.name, orders.status, orders.amount, orders.note]
    limit: 50
    at: { x: 3, y: 0, w: 9, h: 7 }
