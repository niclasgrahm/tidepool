name: Sales overview
layout: { columns: 12, row_height: 80 }
filters:
  - field: customers.region
    measure: revenue                     # shown beside each region instead of its row count
  - field: categories.tree               # a hierarchy: shown as a tree
  - field: products.category
  - field: orders.ordered_at
    widget: date_range
visuals:
  - id: kpi_revenue
    type: kpi
    metrics: [revenue]
    compare: revenue_prev_year
    format: { revenue: compact }         # 167.8M: a total that moves all the time, made readable
    at: { x: 0, y: 0, w: 3, h: 4 }
  - id: by_region
    type: bar
    title: Revenue by region
    description: Every order's value, by the region of its customer
    dimensions: [customers.region]
    metrics: [revenue]
    sort: { by: revenue, desc: true }
    on_click: select
    at: { x: 3, y: 0, w: 5, h: 4 }
  - id: trend
    type: line
    dimensions: [{ field: orders.ordered_at, grain: day }]
    metrics: [revenue, order_count]
    on_brush: select_range
    at: { x: 0, y: 4, w: 12, h: 4 }
  - id: top_products
    type: table
    dimensions: [products.name, products.category]
    metrics: [revenue, revenue_share, order_count, avg_order_value]
    sort: { by: revenue, desc: true }
    limit: 50
    at: { x: 8, y: 0, w: 4, h: 4 }
  - id: kpi_ytd
    type: kpi
    title: Year to date
    metrics: [revenue_ytd]
    at: { x: 0, y: 8, w: 3, h: 2 }
  - id: category_share
    type: pie
    title: Revenue by category
    dimensions: [products.category]
    metrics: [revenue]
    on_click: select
    at: { x: 3, y: 8, w: 5, h: 4 }
  - id: products_map
    type: scatter
    title: Products by revenue and orders
    dimensions: [products.name]
    metrics: [revenue, order_count]
    on_click: select
    at: { x: 8, y: 8, w: 4, h: 4 }
  - id: region_by_category
    type: heatmap
    title: Revenue by region and category
    dimensions: [customers.region, products.category]
    metrics: [revenue]
    on_click: select
    at: { x: 0, y: 12, w: 6, h: 4 }
  - id: region_category_pivot          # totals are the metrics computed again, so the
    type: pivot                        # median's total is the median of every order
    title: Regions by category
    dimensions: [customers.region]
    across: [products.category]
    metrics: [revenue, median_order_value]
    totals: true
    on_click: select
    at: { x: 6, y: 12, w: 6, h: 4 }
