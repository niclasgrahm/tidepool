name: Recent sales
layout: { columns: 12, row_height: 80 }
filters:
  # opens on the last seven days (today included), moving as time passes;
  # a viewer can pick another period, set dates, or clear it
  - field: orders.ordered_at
    widget: date_range
    default: { last: 7, unit: day }
  - field: customers.region
visuals:
  - id: kpi_revenue
    type: kpi
    metrics: [revenue]
    at: { x: 0, y: 0, w: 3, h: 2 }
  - id: kpi_orders
    type: kpi
    metrics: [order_count]
    at: { x: 3, y: 0, w: 3, h: 2 }
  - id: over_time
    type: line
    dimensions: [{ field: orders.ordered_at, grain: auto }]
    metrics: [revenue, order_count]
    on_brush: select_range
    at: { x: 0, y: 2, w: 12, h: 4 }
  # one dimension and no metrics: a filter on the grid, a list to select from
  - id: category
    type: filter
    dimensions: [products.category]
    at: { x: 0, y: 6, w: 3, h: 4 }
  # dimensions without metrics: the pairs some order in the selection has
  - id: who_buys_what
    type: table
    dimensions: [customers.region, products.category]
    at: { x: 3, y: 6, w: 9, h: 4 }
  # a fixed grain, which a viewer can't change; a click selects the whole week
  - id: by_week
    type: bar
    dimensions: [{ field: orders.ordered_at, grain: week }]
    metrics: [revenue]
    on_click: select
    zoom: false
    at: { x: 0, y: 10, w: 12, h: 3 }
