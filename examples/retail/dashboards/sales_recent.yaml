name: Recent sales
layout: { columns: 12, row_height: 80 }
filters:
  # opens on the last seven days (today included), moving as time passes;
  # a viewer can pick another period, set dates, or clear it
  - field: orders.ordered_at
    widget: date_range
    default: { last: 7, unit: day }
  - field: customers.region
visuals:
  - id: kpi_revenue
    type: kpi
    metrics: [revenue]
    at: { x: 0, y: 0, w: 3, h: 2 }
  - id: kpi_orders
    type: kpi
    metrics: [order_count]
    at: { x: 3, y: 0, w: 3, h: 2 }
  - id: by_day
    type: line
    dimensions: [{ field: orders.ordered_at, grain: day }]
    metrics: [revenue, order_count]
    on_brush: select_range
    at: { x: 0, y: 2, w: 12, h: 4 }
