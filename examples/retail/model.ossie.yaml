version: "0.2.0"
name: retail
description: "An outdoor shop: its orders, customers and products."
datasets:
  - name: orders
    source: orders                       # table name from tables/*.yaml
    fields:
      - name: ordered_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: ordered_at }] }
        datatype: DateTimeTz
        dimension: { is_time: true }
        label: Order time
      - name: order_year                 # derived field: a cheap dimension (see §6.2)
        expression: { dialects: [{ dialect: ANSI_SQL, expression: "EXTRACT(YEAR FROM ordered_at)" }] }
        datatype: Integer
      - name: status
        expression: { dialects: [{ dialect: ANSI_SQL, expression: status }] }
  - name: customers
    source: customers
    primary_key: [customer_id]
    fields:
      - name: region
        expression: { dialects: [{ dialect: ANSI_SQL, expression: region }] }
        label: Region
        ai_context: { synonyms: [area, territory, market] }
      - name: coast                      # derived over one dictionary column: evaluated per
        expression:                      # region, not per row (a derived dictionary, plan §4.4)
          dialects:
            - dialect: ANSI_SQL
              expression: "CASE WHEN region IN ('east', 'west') THEN 'coastal' ELSE COALESCE(region, 'unknown') END"
  - name: products
    source: products
    primary_key: [product_id]
    fields:
      - name: category
        expression: { dialects: [{ dialect: ANSI_SQL, expression: category }] }
  - name: categories
    source: categories
    primary_key: [category]
    custom_extensions:
      - vendor_name: TIDEPOOL                # a parent–child hierarchy (plan §5.6): a tree
        data: '{"hierarchy": {"name": "tree", "parent": "parent", "kind": "level"}}'

relationships:
  - name: order_customer
    from: orders                         # many side
    to: customers                        # one side
    from_columns: [customer_id]
    to_columns: [customer_id]
  - name: order_product
    from: orders
    to: products
    from_columns: [product_id]
    to_columns: [product_id]
  - name: product_category
    from: products
    to: categories
    from_columns: [category]
    to_columns: [category]

metrics:
  - name: revenue
    description: Gross order value
    ai_context: { synonyms: [sales, turnover, gross sales], instructions: "every order, whatever its status; paid_revenue counts paid orders only" }
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount)" }] }
  - name: paid_revenue                   # SQL's standard FILTER clause instead of set analysis
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount) FILTER (WHERE orders.status = 'paid')" }] }
  - name: order_count
    ai_context: { synonyms: [orders, number of orders] }
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "COUNT(*)" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"table": "orders"}'      # anchor table for COUNT(*)
  - name: customer_count
    ai_context: { synonyms: [buyers, active customers] }
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "COUNT(DISTINCT orders.customer_id)" }] }
  - name: avg_order_value
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "revenue / order_count" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"kind": "derived"}'      # expression over other metrics, computed after aggregation
  - name: revenue_all_regions
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount)" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"ignore_selection": ["customers.region"]}'
  - name: revenue_prev_year
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount)" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"time_offset": "-1y", "time_field": "orders.ordered_at"}'
  - name: revenue_total                  # the same sum without the visual's dimensions
    description: Revenue of everything a visual shows, whatever its dimensions
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount)" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"total": ["*"]}'
  - name: revenue_share                  # each group's share of it
    description: A group's share of the revenue the visual shows
    ai_context: { synonyms: [share, percent of revenue, mix] }
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "revenue / revenue_total" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"kind": "derived", "format": "percent decimals:1"}'
  - name: median_order_value             # exact: every order's value counted
    description: The middle order value
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "MEDIAN(orders.amount)" }] }
  - name: order_value_p90
    description: The order value nine orders in ten stay under
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY orders.amount)" }] }
  - name: latest_status                  # the status of the newest order
    description: The status of the newest order
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "ARG_MAX(orders.status, orders.ordered_at)" }] }
  - name: revenue_ytd                    # from 1 January to where the time selection ends
    description: Revenue from the start of the year
    ai_context: { synonyms: [year to date, YTD] }
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount)" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"time_window": "ytd", "time_field": "orders.ordered_at"}'
  - name: revenue_7d                     # by day: each day's last seven days
    description: Revenue of the last seven days
    ai_context: { synonyms: [rolling week, last 7 days] }
    expression: { dialects: [{ dialect: ANSI_SQL, expression: "SUM(orders.amount)" }] }
    custom_extensions:
      - vendor_name: TIDEPOOL
        data: '{"time_window": "last:7d", "time_field": "orders.ordered_at"}'

custom_extensions:
  - vendor_name: TIDEPOOL
    data: '{"filter_direction": "one_to_many"}'

ai_context:                              # for agents: read by describe_model
  instructions: >-
    Sales of an outdoor shop. Time questions group or filter by
    orders.ordered_at; "this year" and "last month" are ranges on it.
    An order's status is paid, shipped or returned.
    Categories form a tree (categories.tree): selecting one selects
    everything below it.
  examples:
    - "Which region sold the most last month?"
    - "Revenue by day this week"
    - "How many customers bought tents?"
