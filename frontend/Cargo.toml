[package]
name = "tidepool-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Copyleft side of the split: see licensing.md.
license = "AGPL-3.0-or-later"
publish = false

[lints]
workspace = true

# A client-side-rendered Leptos app, built by trunk (`just frontend`) into
# `frontend/dist`, which the server serves or embeds. A workspace member so it
# shares lints, `just ci` and the licence check; it compiles natively for
# clippy and tests, and for wasm32 when trunk builds it.
[dependencies]
tidepool-protocol.workspace = true
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Response", "Headers", "Request", "RequestInit", "Location", "WebSocket", "MessageEvent", "CloseEvent", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "ResizeObserver", "HashChangeEvent", "MediaQueryList", "Performance"] }
